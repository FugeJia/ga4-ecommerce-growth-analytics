[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ga4-growth-analytics"
version = "1.0.0"
description = "Reproducible GA4 ecommerce analytics, data contracts and experimentation toolkit"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["duckdb==1.4.1", "pandas==2.2.3", "pyarrow==19.0.1", "numpy==2.2.6", "scipy==1.15.3", "plotly==6.0.1", "streamlit==1.45.1", "google-cloud-bigquery==3.31.0", "db-dtypes==1.4.2"]

[project.optional-dependencies]
dev = ["pytest==8.3.5", "ruff==0.11.13", "sqlglot==26.16.4"]

[project.scripts]
ga4 = "ga4_growth.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ga4_growth = ["sql/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
